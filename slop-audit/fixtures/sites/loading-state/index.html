<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit ridership recovery</title>
<style>
  @font-face { font-family: "Ridership Sans"; src: url("fonts/ridership-sans.woff2") format("woff2"); }
  body { margin: 0; font-family: "Ridership Sans", Arial, sans-serif; color: #1b1b1b; background: #fff; }
  main { padding: 40px 56px; }
  .skeleton .bar { height: 18px; background: #e6e6e6; border-radius: 4px; margin: 12px 0; }
  .skeleton .bar.w60 { width: 60%; } .skeleton .bar.w80 { width: 80%; } .skeleton .block { height: 240px; background: #eeeeee; border-radius: 8px; margin-top: 20px; }
  .content { display: none; }
  .ready .skeleton { display: none; } .ready .content { display: block; }
</style>
</head>
<body>
<main id="story" aria-busy="true">
  <div class="skeleton" id="skeleton" aria-hidden="true">
    <div class="bar w60"></div><div class="bar w80"></div><div class="bar w80"></div><div class="block"></div>
  </div>
  <div class="content" id="content">
    <h1>Bus ridership is back to 91% of 2019 levels</h1>
    <p>Weekday boardings on the city's bus network reached 212,000 in September 2026, compared with 233,000 in September 2019.</p>
  </div>
</main>
<script>
  // Content appears after the data request finishes (simulated: 4 seconds).
  setTimeout(() => { const m = document.getElementById("story"); m.classList.add("ready"); m.setAttribute("aria-busy", "false"); }, 4000);
</script>
</body>
</html>
