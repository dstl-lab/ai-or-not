[project]
name = "aiornot"
version = "0.1.0"
description = "Study platform: do students think these DSC 106 websites were AI-generated?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
aiornot = "aiornot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
analysis = [
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiornot"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
